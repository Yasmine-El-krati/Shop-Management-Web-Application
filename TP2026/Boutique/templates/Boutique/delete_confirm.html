{% extends 'Boutique/base.html' %}
{% block title %}Confirmation de suppression{% endblock %}
{% block content %}
<h2>Confirmation de suppression</h2>
<p>Etes-vous sur de vouloir supprimer {{ type }} :
   <strong>{{ objet }}</strong> ?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit"
            style="background:red;color:white;padding:8px 16px;">
        Confirmer la suppression
    </button>
    <a href="javascript:history.back()" style="margin-left:10px;">
        Annuler
    </a>
</form>
{% endblock %}
