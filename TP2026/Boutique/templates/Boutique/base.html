<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion Magasin{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        nav {
            background: #333;
            padding: 10px 20px;
            text-align: center;
        }
        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover { color: #ccc; }
        .content { padding: 20px; }
        footer {
            text-align: center;
            padding: 10px;
            background: #eee;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'clients' %}">Clients</a>
        <a href="{% url 'produits' %}">Produits</a>
        <a href="{% url 'commandes' %}">Commandes</a>
        <a href="{% url 'details' %}">Details</a>

      {% if request.user.is_authenticated %}
            <span style='color : #aaffaa';>{{ request.user.username}}</span>
            <a href="{%url 'deconnexion' %}"> Deconnexion</a>
      {% else %}
            <a href="{% url 'connexion'%}"> connexion </a>
            <a href="{% url 'register'%}"> Inscription </a>

      {%endif%}
      
    
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>&copy; {{ "maintenant"|date:"Y" }} - TP Django</p>
    </footer>
</body>
</html>
